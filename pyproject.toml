[project]
name = "support-case-insights"
version = "0.1.0"
description = "Python Lambda code, scripts and tests for Support Case Insights."
requires-python = ">=3.12,<3.13"
# Dependencies are pinned with hashes in requirements.txt (Lambda layer) and requirements-dev.txt.

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["cdk.out", "node_modules", ".venv", "coverage", "reports"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "PT", "C4", "PL", "ANN"]

[tool.ruff.lint.per-file-ignores]
# Tests use fake credentials with stubbed clients and literal expected values.
"test/**" = ["S101", "S105", "S106", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "test", "scripts"]
mypy_path = "src/lambda:test/support"
explicit_package_bases = true
warn_unreachable = true
cache_dir = ".mypy_cache"

[tool.pytest.ini_options]
testpaths = ["test"]
# pytest's default norecursedirs skips any directory named "build", which would drop test/build.
norecursedirs = [".*", "__pycache__", "node_modules", "cdk.out"]
pythonpath = ["src/lambda", "test/support"]
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = [
    "live_bedrock: calls the real Amazon Bedrock API; skipped unless CASE_INSIGHTS_LIVE_BEDROCK=1",
]
xfail_strict = true

[tool.coverage.run]
source = ["src/lambda"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.bandit]
exclude_dirs = ["test", ".venv", "node_modules", "cdk.out"]
